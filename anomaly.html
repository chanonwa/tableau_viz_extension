<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomaly Detection</title>
    <link rel="stylesheet" href="./settings.css">
    <style>
      :root {
        color: #202124;
        font: 14px "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 320px;
        background: #fff;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        flex: 0 0 auto;
        padding: 12px 16px 8px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      #summary {
        color: #5f6368;
        font-size: 12px;
      }

      .legend {
        display: flex;
        gap: 12px;
        margin-left: auto;
        color: #5f6368;
        font-size: 12px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .legend .band-swatch {
        width: 14px;
        border-radius: 2px;
        background: #e8f0fe;
      }

      #panels {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 0 16px 12px;
        overflow-y: auto;
      }

      .panel {
        display: flex;
        flex: 1 0 220px;
        flex-direction: column;
        min-height: 220px;
        border-top: 1px solid #e8eaed;
        padding-top: 8px;
      }

      .panel-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
      }

      .panel-title {
        font-weight: 600;
      }

      .panel-method {
        color: #5f6368;
        font-size: 11px;
      }

      .badge {
        padding: 1px 7px;
        border-radius: 10px;
        background: #f1f3f4;
        color: #5f6368;
        font-size: 11px;
        font-weight: 600;
      }

      .badge.alert {
        background: #fce8e6;
        color: #c5221f;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
        margin: 4px 0 2px;
        font-size: 12px;
      }

      .stat-name {
        color: #5f6368;
      }

      .stat-value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .panel-chart {
        position: relative;
        flex: 1 1 auto;
        min-height: 140px;
      }

      .panel-chart svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .panel-error {
        color: #5f6368;
        font-size: 12px;
      }

      .tick-label {
        fill: #5f6368;
        font-size: 11px;
      }

      .grid-line {
        stroke: #e8eaed;
        stroke-width: 1;
      }

      .axis-line {
        stroke: #9aa0a6;
        stroke-width: 1;
      }

      .band {
        fill: #e8f0fe;
      }

      .expected-line {
        fill: none;
        stroke: #80868b;
        stroke-width: 1.25;
        stroke-dasharray: 4 3;
      }

      .value-line {
        fill: none;
        stroke: #4e79a7;
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .value-dot {
        fill: #4e79a7;
      }

      .anomaly-high {
        fill: #d93025;
        stroke: #fff;
        stroke-width: 1.5;
      }

      .anomaly-low {
        fill: #e8710a;
        stroke: #fff;
        stroke-width: 1.5;
      }

      .hover-target {
        fill: transparent;
      }

      .hover-target:hover {
        fill: rgba(60, 64, 67, 0.06);
      }

      #anomaly-list {
        flex: 0 0 auto;
        border-top: 1px solid #e8eaed;
        padding-top: 8px;
      }

      #anomaly-list h2 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
      }

      #anomaly-list table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      #anomaly-list th {
        padding: 3px 8px 3px 0;
        border-bottom: 1px solid #dadce0;
        color: #5f6368;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
      }

      #anomaly-list td {
        padding: 3px 8px 3px 0;
        border-bottom: 1px solid #f1f3f4;
      }

      #anomaly-list .number {
        text-align: right;
      }

      .type-high {
        color: #c5221f;
        font-weight: 600;
      }

      .type-low {
        color: #b05a00;
        font-weight: 600;
      }

      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #5f6368;
        text-align: center;
      }

      #message[hidden] {
        display: none;
      }

      #tooltip {
        position: fixed;
        z-index: 2;
        max-width: 340px;
        padding: 8px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.25);
        font-size: 12px;
        pointer-events: none;
      }

      #tooltip[hidden] {
        display: none;
      }

      .tooltip-title {
        margin-bottom: 4px;
        font-weight: 600;
      }

      .tooltip-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.5;
      }

      .tooltip-name {
        color: #5f6368;
      }

      .tooltip-value {
        margin-left: auto;
        padding-left: 12px;
        font-weight: 600;
        text-align: right;
      }

      #settings-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        overflow-y: auto;
        background: rgba(32, 33, 36, 0.35);
      }

      #settings-overlay[hidden] {
        display: none;
      }

      #settings-overlay .settings-form {
        width: 100%;
        max-width: 520px;
        padding: 12px 16px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(32, 33, 36, 0.3);
      }

      #preview-settings {
        padding: 3px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      #preview-settings[hidden] {
        display: none;
      }
    </style>
    <script defer src="./vendor/tableau.extensions.1.latest.min.js"></script>
    <script defer src="./anomaly-detect.js"></script>
    <script defer src="./anomaly-settings-form.js"></script>
    <script defer src="./anomaly.js"></script>
  </head>
  <body>
    <header>
      <h1>Anomaly Detection</h1>
      <span id="summary" role="status"></span>
      <div class="legend" aria-label="Legend">
        <span><i class="band-swatch"></i>Normal range</span>
        <span><i style="background:#d93025"></i>Spike</span>
        <span><i style="background:#e8710a"></i>Dip</span>
        <button id="preview-settings" type="button" hidden>Settings</button>
      </div>
    </header>
    <main id="panels" aria-label="Anomaly charts">
      <div id="message" role="status" hidden></div>
    </main>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="settings-overlay" hidden>
      <div id="settings-form" class="settings-form" role="dialog" aria-label="Anomaly detection settings"></div>
    </div>
  </body>
</html>
