<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Measure Combo Chart</title>
    <link rel="stylesheet" href="./settings.css">
    <style>
      :root {
        color: #202124;
        font: 14px "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 320px;
        background: #fff;
      }

      header {
        flex: 0 0 auto;
        padding: 12px 16px 8px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      #settings-button {
        padding: 2px 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: none;
        color: #5f6368;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }

      #settings-button:hover,
      #settings-button:focus-visible {
        border-color: #dadce0;
        outline: none;
      }

      #series-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 6px;
      }

      .series-control {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        max-width: 260px;
        padding: 5px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .series-control:hover,
      .series-control:focus-visible {
        border-color: #5b6b7a;
        outline: none;
      }

      .series-control-wrap {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
      }

      .line-style {
        max-width: 98px;
        padding: 5px 4px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #5f6368;
        font: inherit;
        font-size: 11px;
      }

      .line-style:disabled {
        opacity: 0.5;
      }

      .series-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .series-mode {
        color: #5f6368;
        font-size: 11px;
        text-transform: uppercase;
      }

      #forecast-note {
        color: #5f6368;
        font-size: 11px;
      }

      #forecast-note:empty {
        display: none;
      }

      #chart {
        position: relative;
        flex: 1 1 auto;
        min-height: 220px;
        padding: 0 8px 8px;
      }

      #chart svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #5f6368;
        text-align: center;
      }

      #message[hidden] {
        display: none;
      }

      .axis-label,
      .tick-label {
        fill: #5f6368;
        font-size: 11px;
      }

      .grid-line {
        stroke: #e8eaed;
        stroke-width: 1;
      }

      .axis-line {
        stroke: #9aa0a6;
        stroke-width: 1;
      }

      .forecast-area {
        fill: #f1f3f4;
      }

      .hover-target {
        fill: transparent;
      }

      .hover-target:hover {
        fill: rgba(60, 64, 67, 0.06);
      }

      .value-label {
        fill: #3c4043;
        font-size: 10px;
      }

      .text-label {
        fill: #202124;
        font-size: 11px;
        font-weight: 600;
      }

      #tooltip {
        position: absolute;
        z-index: 2;
        max-width: 340px;
        padding: 8px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.25);
        font-size: 12px;
        pointer-events: none;
      }

      #tooltip[hidden] {
        display: none;
      }

      .tooltip-title {
        margin-bottom: 4px;
        font-weight: 600;
      }

      .tooltip-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.5;
      }

      .tooltip-swatch {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }

      .tooltip-name {
        color: #5f6368;
      }

      .tooltip-value {
        margin-left: auto;
        padding-left: 12px;
        font-weight: 600;
        text-align: right;
      }

      #settings-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        overflow-y: auto;
        background: rgba(32, 33, 36, 0.35);
      }

      #settings-overlay[hidden] {
        display: none;
      }

      #settings-overlay .settings-form {
        width: 100%;
        max-width: 560px;
        padding: 12px 16px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(32, 33, 36, 0.3);
      }
    </style>
    <script defer src="./vendor/tableau.extensions.1.latest.min.js"></script>
    <script defer src="./forecast.js"></script>
    <script defer src="./settings-form.js"></script>
    <script defer src="./combo.js"></script>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Multi-Measure Combo Chart</h1>
        <button id="settings-button" type="button" title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div id="series-list" aria-label="Series chart types and line styles"></div>
      <div id="forecast-note" role="status"></div>
    </header>
    <main id="chart" aria-label="Combo chart">
      <div id="message" role="status" hidden></div>
      <div id="tooltip" role="tooltip" hidden></div>
    </main>
    <div id="settings-overlay" hidden>
      <div id="settings-form" class="settings-form" role="dialog" aria-label="Chart settings"></div>
    </div>
  </body>
</html>
