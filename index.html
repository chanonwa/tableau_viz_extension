<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Measure Combo Chart</title>
    <link rel="stylesheet" href="./settings.css">
    <style>
      :root {
        color: #202124;
        font: 14px "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 320px;
        background: #fff;
      }

      header {
        flex: 0 0 auto;
        padding: 12px 16px 8px;
      }

      header:not(:has(:not(:empty))) {
        display: none;
      }

      /* Optional title from Format Extension; its color and size are set there */
      #title {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 700;
      }

      #legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        padding: 0 0 6px;
        color: #5f6368;
        font-size: 12px;
      }

      #legend:empty {
        display: none;
      }

      /* Extra space before the Bar Style values and before the measures */
      #legend .group-start {
        margin-left: 14px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #202124;
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }

      #forecast-note {
        color: #5f6368;
        font-size: 11px;
      }

      #forecast-note:empty {
        display: none;
      }

      #chart {
        position: relative;
        flex: 1 1 auto;
        min-height: 220px;
        padding: 0 8px 8px;
      }

      #chart svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #5f6368;
        text-align: center;
      }

      #message[hidden] {
        display: none;
      }

      .axis-label,
      .tick-label {
        fill: #5f6368;
        font-size: 11px;
      }

      /* Entrance animation. --elapsed: time already played by the shared animation (chart-sync.js), so a chart
         linked with the radial chart stays in step with it */
      .grow {
        animation: grow 0.7s ease-out both;
        animation-delay: calc(-1 * var(--elapsed, 0ms));
      }

      .sweep {
        animation: sweep 0.9s ease-in-out both;
        animation-delay: calc(-1 * var(--elapsed, 0ms));
      }

      .fade-in {
        animation: fade-in 0.3s ease-out both;
        animation-delay: calc(0.6s - var(--elapsed, 0ms));
      }

      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }

      @keyframes sweep {
        from {
          transform: scaleX(0);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .grow,
        .sweep,
        .fade-in {
          animation: none;
        }
      }

      .grid-line {
        stroke: #e8eaed;
        stroke-width: 1;
      }

      .axis-line {
        stroke: #9aa0a6;
        stroke-width: 1;
      }

      .forecast-area {
        fill: #f1f3f4;
      }

      .hover-target {
        fill: transparent;
      }

      .hover-target:hover {
        fill: rgba(60, 64, 67, 0.06);
      }

      #tooltip {
        position: absolute;
        z-index: 2;
        max-width: 340px;
        padding: 8px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.25);
        font-size: 12px;
        pointer-events: none;
      }

      #tooltip[hidden] {
        display: none;
      }

      .tooltip-title {
        margin-bottom: 4px;
        font-weight: 600;
      }

      .tooltip-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.5;
      }

      .tooltip-swatch {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }

      .tooltip-name {
        color: #5f6368;
      }

      .tooltip-value {
        margin-left: auto;
        padding-left: 12px;
        font-weight: 600;
        text-align: right;
      }

      #settings-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        overflow-y: auto;
        background: rgba(32, 33, 36, 0.35);
      }

      #settings-overlay[hidden] {
        display: none;
      }

      #settings-overlay .settings-form {
        width: 100%;
        max-width: 560px;
        padding: 12px 16px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(32, 33, 36, 0.3);
      }
    </style>
    <script defer src="./vendor/tableau.extensions.1.latest.min.js"></script>
    <script defer src="./colors.js"></script>
    <script defer src="./chart-sync.js"></script>
    <script defer src="./forecast.js"></script>
    <script defer src="./settings-form.js"></script>
    <script defer src="./combo.js"></script>
  </head>
  <body>
    <header>
      <h1 id="title" hidden></h1>
      <div id="legend" aria-label="Legend"></div>
      <div id="forecast-note" role="status"></div>
    </header>
    <main id="chart" aria-label="Combo chart">
      <div id="message" role="status" hidden></div>
      <div id="tooltip" role="tooltip" hidden></div>
    </main>
    <div id="settings-overlay" hidden>
      <div id="settings-form" class="settings-form" role="dialog" aria-label="Chart settings"></div>
    </div>
  </body>
</html>
