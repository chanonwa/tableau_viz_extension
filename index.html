<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Measure Combo Chart</title>
    <style>
      :root {
        color: #202124;
        font: 14px "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-width: 320px;
        background: #fff;
      }

      header {
        flex: 0 0 auto;
        padding: 12px 16px 8px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      #settings-button {
        padding: 4px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      #settings-button:hover,
      #settings-button:focus-visible,
      #settings-button[aria-expanded="true"] {
        border-color: #5b6b7a;
        outline: none;
      }

      #settings-panel {
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #f8f9fa;
      }

      #settings-panel[hidden] {
        display: none;
      }

      .settings-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 600;
      }

      #color-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
      }

      .color-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 280px;
      }

      .color-row input[type="color"] {
        width: 28px;
        height: 22px;
        padding: 0;
        border: 1px solid #dadce0;
        border-radius: 3px;
        background: #fff;
        cursor: pointer;
      }

      .color-hex {
        width: 70px;
        padding: 2px 4px;
        border: 1px solid #dadce0;
        border-radius: 3px;
        font: inherit;
        font-size: 11px;
      }

      .text-button {
        padding: 2px 6px;
        border: 1px solid #dadce0;
        border-radius: 3px;
        background: #fff;
        color: #5f6368;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      #forecast-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 2px 0 4px;
        color: #5f6368;
        font-size: 12px;
      }

      .forecast-select {
        max-width: 200px;
      }

      .forecast-hint {
        font-size: 11px;
      }

      .forecast-area {
        fill: #f1f3f4;
      }

      .settings-options {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-bottom: 8px;
        font-size: 12px;
      }

      .settings-options label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .hover-target {
        fill: transparent;
      }

      .hover-target:hover {
        fill: rgba(60, 64, 67, 0.06);
      }

      .value-label {
        fill: #3c4043;
        font-size: 10px;
      }

      .text-label {
        fill: #202124;
        font-size: 11px;
        font-weight: 600;
      }

      #tooltip {
        position: absolute;
        z-index: 2;
        max-width: 320px;
        padding: 8px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.25);
        font-size: 12px;
        pointer-events: none;
      }

      #tooltip[hidden] {
        display: none;
      }

      .tooltip-title {
        margin-bottom: 4px;
        font-weight: 600;
      }

      .tooltip-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.5;
      }

      .tooltip-swatch {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }

      .tooltip-name {
        color: #5f6368;
      }

      .tooltip-value {
        margin-left: auto;
        padding-left: 12px;
        font-weight: 600;
        text-align: right;
      }

      #series-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 6px;
      }

      .series-control {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        max-width: 260px;
        padding: 5px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .series-control:hover,
      .series-control:focus-visible {
        border-color: #5b6b7a;
        outline: none;
      }

      .series-control-wrap {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
      }

      .line-style {
        max-width: 98px;
        padding: 5px 4px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #5f6368;
        font: inherit;
        font-size: 11px;
      }

      .line-style:disabled {
        opacity: 0.5;
      }

      .series-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .series-mode {
        color: #5f6368;
        font-size: 11px;
        text-transform: uppercase;
      }

      #chart {
        position: relative;
        flex: 1 1 auto;
        min-height: 220px;
        padding: 0 8px 8px;
      }

      #chart svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #5f6368;
        text-align: center;
      }

      #message[hidden] {
        display: none;
      }

      .axis-label,
      .tick-label {
        fill: #5f6368;
        font-size: 11px;
      }

      .grid-line {
        stroke: #e8eaed;
        stroke-width: 1;
      }

      .axis-line {
        stroke: #9aa0a6;
        stroke-width: 1;
      }
    </style>
    <script defer src="./vendor/tableau.extensions.1.latest.min.js"></script>
    <script defer src="./combo.js"></script>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Multi-Measure Combo Chart</h1>
        <button id="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel">⚙ Settings</button>
      </div>
      <div id="settings-panel" hidden>
        <div class="settings-heading">
          <span>Display</span>
        </div>
        <div class="settings-options">
          <label><input id="show-value-labels" type="checkbox"> Show measure values on marks</label>
          <label><input id="show-tooltips" type="checkbox" checked> Show tooltips</label>
        </div>
        <div class="settings-heading">
          <span>Measure colors</span>
          <button id="reset-colors" class="text-button" type="button">Reset colors</button>
        </div>
        <div id="color-list"></div>
      </div>
      <div id="series-list" aria-label="Series chart types and line styles"></div>
      <div id="forecast-controls" aria-label="Forecast settings"></div>
    </header>
    <main id="chart" aria-label="Combo chart">
      <div id="message" role="status" hidden></div>
      <div id="tooltip" role="tooltip" hidden></div>
    </main>
  </body>
</html>
