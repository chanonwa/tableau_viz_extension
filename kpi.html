<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KPI Card</title>
    <link rel="stylesheet" href="./settings.css">
    <style>
      :root {
        font: 14px "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /* Colors come from the settings as CSS variables on the body (kpi.js) */
      body {
        position: relative;
        min-width: 160px;
        padding: 4px;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
      }

      #card {
        display: flex;
        gap: 12px;
        height: 100%;
        padding: 12px 16px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }

      #card.no-border {
        border-color: transparent;
      }

      #card[hidden] {
        display: none;
      }

      .icon {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }

      .icon svg {
        width: 22px;
        height: 22px;
      }

      .body {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 22px;
      }

      /* Long titles wrap onto a second line */
      .title {
        display: -webkit-box;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-weight: 600;
        line-height: 1.25;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      /* Alignment from the settings */
      #card.middle .body {
        justify-content: center;
      }

      #card.align-center .title,
      #card.align-center .line {
        text-align: center;
      }

      #card.align-right .title,
      #card.align-right .line {
        text-align: right;
      }

      #card.align-center .value-row {
        justify-content: center;
      }

      #card.align-right .value-row {
        justify-content: flex-end;
      }

      #card.align-center .sparkline,
      #card.align-right .sparkline {
        margin-left: 0;
      }

      #card.align-right .head {
        flex-direction: row-reverse;
      }

      .status {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .value-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .value {
        flex: 0 1 auto;
        overflow: hidden;
        font-weight: 700;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .value-note {
        flex: 1 1 auto;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sparkline {
        flex: 0 1 140px;
        min-width: 60px;
        height: 36px;
        margin-left: auto;
        overflow: visible;
      }

      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .track {
        position: relative;
        flex: 1 1 auto;
        height: 8px;
        border-radius: 4px;
        background: var(--track);
      }

      .fill {
        height: 100%;
        border-radius: 4px;
        transform-origin: left center;
      }

      .marker {
        position: absolute;
        top: -4px;
        width: 2px;
        height: 16px;
        margin-left: -1px;
        border-radius: 1px;
        background: var(--text);
      }

      .progress-percent {
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 700;
      }

      .line {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .line strong {
        color: var(--text);
        font-weight: 600;
      }

      .change-value {
        font-weight: 700;
      }

      #message {
        display: grid;
        height: 100%;
        place-items: center;
        padding: 12px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      #message[hidden] {
        display: none;
      }

      /* Entrance animation. --elapsed: time already played by the shared animation (chart-sync.js), so the cards
         stay in step with the combo and radial charts on the same dashboard */
      .animate .value,
      .animate .line,
      .animate .status {
        animation: rise 0.5s ease-out both;
        animation-delay: calc(-1 * var(--elapsed, 0ms));
      }

      .animate .fill {
        animation: grow-x 0.8s ease-out both;
        animation-delay: calc(-1 * var(--elapsed, 0ms));
      }

      .animate .sparkline .trend-line {
        stroke-dasharray: 100 100;
        animation: draw 0.8s ease-out both;
        animation-delay: calc(-1 * var(--elapsed, 0ms));
      }

      .animate .sparkline .trend-area,
      .animate .sparkline .trend-dot {
        animation: fade-in 0.3s ease-out both;
        animation-delay: calc(0.6s - var(--elapsed, 0ms));
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      @keyframes grow-x {
        from {
          transform: scaleX(0);
        }
      }

      @keyframes draw {
        from {
          stroke-dashoffset: 100;
        }

        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .animate * {
          animation: none !important;
        }
      }

      #preview-settings {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 2;
        padding: 2px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #202124;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      #preview-settings[hidden] {
        display: none;
      }

      #settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        overflow-y: auto;
        background: rgba(32, 33, 36, 0.35);
      }

      #settings-overlay[hidden] {
        display: none;
      }

      #settings-overlay .settings-form {
        width: 100%;
        max-width: 560px;
        padding: 12px 16px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(32, 33, 36, 0.3);
      }
    </style>
    <script defer src="./vendor/tableau.extensions.1.latest.min.js"></script>
    <script defer src="./chart-sync.js"></script>
    <script defer src="./kpi-settings-form.js"></script>
    <script defer src="./kpi.js"></script>
  </head>
  <body>
    <div id="card" aria-live="polite" hidden></div>
    <div id="message" role="status" hidden></div>
    <button id="preview-settings" type="button" hidden>Settings</button>
    <div id="settings-overlay" hidden>
      <div id="settings-form" class="settings-form" role="dialog" aria-label="KPI card settings"></div>
    </div>
  </body>
</html>
